name: Publicar versão estática no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      VITE_GITHUB_PAGES_BASE: /${{ github.event.repository.name }}/
      VITE_MEDIA_BASE_URL: https://cdn.jsdelivr.net/gh/jonathanstrutzz/auto-truck-media@3b99d5c2b9a0e6b4693bb196a916a51f218a6759/public-media
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preparar pnpm
        run: corepack enable && pnpm --version

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Gerar site estático
        run: pnpm build:github-pages

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Enviar versão estática
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/github-pages

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
